name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux
      - name: Repository tests
        run: ./tests/test.sh
      - name: ShellCheck
        run: shellcheck agent-status.tmux bin/* scripts/*.sh tests/*.sh
